<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aelon AI</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#050609;
color:white;
font-family:Arial,sans-serif;
overflow:hidden;
}

/* INTRO */

#intro{
position:fixed;
inset:0;
background:#020305;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
z-index:10;
animation:hideIntro 1s ease 5s forwards;
}

.heart{
font-size:100px;
animation:pulse 1s infinite;
filter:drop-shadow(0 0 35px #ff4d8d);
}

.earth{
font-size:0;
margin-top:20px;
animation:earth 2s ease 2s forwards;
}

.intro-title{
margin-top:30px;
letter-spacing:8px;
font-size:28px;
opacity:0;
animation:title 1s ease 3.5s forwards;
}

@keyframes pulse{
0%,100%{transform:scale(1)}
50%{transform:scale(1.18)}
}

@keyframes earth{
0%{
font-size:0;
transform:rotate(-180deg);
opacity:0;
}
100%{
font-size:110px;
transform:rotate(0);
opacity:1;
}
}

@keyframes title{
to{opacity:1}
}

@keyframes hideIntro{
to{
opacity:0;
visibility:hidden;
}
}


/* APP */

#app{
opacity:0;
animation:showApp 1.5s ease 5.2s forwards;
height:100vh;
}

@keyframes showApp{
to{opacity:1}
}


/* HEADER */

header{
height:70px;
border-bottom:1px solid #20232c;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
background:#080a0f;
}

.logo{
font-size:21px;
font-weight:bold;
}

.login{
background:white;
color:black;
border:0;
padding:11px 17px;
border-radius:25px;
font-weight:bold;
}


/* TIME */

#time{
position:fixed;
top:82px;
left:15px;
font-size:13px;
color:#aaa;
}


/* MAIN */

main{
height:calc(100vh - 70px);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.container{
width:900px;
max-width:100%;
text-align:center;
}

h1{
font-size:42px;
margin:10px 0;
}

.subtitle{
color:#9297a3;
}


/* CHAT */

.chat{
margin-top:30px;
background:#10131a;
border:1px solid #252936;
border-radius:25px;
overflow:hidden;
}

.messages{
height:390px;
padding:20px;
overflow-y:auto;
text-align:left;
}

.message{
padding:12px 16px;
border-radius:18px;
margin:10px 0;
max-width:80%;
white-space:pre-wrap;
}

.user{
background:#29303d;
margin-left:auto;
}

.ai{
background:#181c25;
}


/* INPUT */

.input{
display:flex;
gap:10px;
padding:14px;
border-top:1px solid #252936;
}

.input input{
flex:1;
background:#080a0f;
border:1px solid #292e3a;
border-radius:25px;
padding:14px;
color:white;
outline:none;
}

.input button{
width:48px;
height:48px;
border:0;
border-radius:50%;
background:white;
cursor:pointer;
}

.upload{
width:48px;
height:48px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:#20242e;
cursor:pointer;
}

</style>
</head>


<body>


<!-- INTRO -->

<div id="intro">

<div class="heart">♥</div>

<div class="earth">🌍</div>

<div class="intro-title">
AELON AI
</div>

</div>


<!-- APP -->

<div id="app">

<header>

<div class="logo">
♥ Aelon AI
</div>

<button class="login">
Continue with Google
</button>

</header>


<div id="time">
Loading time...
</div>


<main>

<div class="container">

<h1>
Welcome to Aelon AI
</h1>

<p class="subtitle">
Ask questions or create your own AI images
</p>


<div class="chat">

<div class="messages" id="messages">

<div class="message ai">
Hello! I'm Aelon AI. How can I help you?
</div>

</div>


<div class="input">

<label class="upload">

📷

<input
type="file"
accept="image/*"
id="image"
hidden
>

</label>


<input
id="prompt"
placeholder="Ask anything..."
>


<button onclick="send()">
➤
</button>

</div>

</div>

</div>

</main>

</div>


<script>

/* LOCAL TIME */

function updateTime(){

const now=new Date();

const zone=
Intl.DateTimeFormat()
.resolvedOptions()
.timeZone;

const time=
now.toLocaleTimeString(
[],
{
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
}
);

document.getElementById("time").textContent=
zone+" • "+time;

}

updateTime();

setInterval(updateTime,1000);


/* CHAT DEMO */

function send(){

const input=
document.getElementById("prompt");

const text=
input.value.trim();

if(!text)return;


const messages=
document.getElementById("messages");


const user=
document.createElement("div");

user.className=
"message user";

user.textContent=text;

messages.appendChild(user);


input.value="";


const ai=
document.createElement("div");

ai.className=
"message ai";

ai.textContent=
"Your AI backend will answer this question here. The next step is connecting the AI API.";

messages.appendChild(ai);

messages.scrollTop=
messages.scrollHeight;

}

</script>

</body>
</html>
